<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1</title>
<style>
  :root {
    /* 背景は生成り。デスクトップ越しに透けさせられる(不透明度は右クリックメニューから) */
    --bg-r: 240; --bg-g: 234; --bg-b: 216;
    --bg-alpha: 1;
    --ink: #24211f;
    --ink-2: #3a3834;
    --ink-3: #4a4742;
    --frame: #3d3a35;                       /* ブロックの枠 */
    --future-line: rgba(36, 33, 31, 0.22);
    --accent: #427660;                      /* 唐草風呂敷の深い緑 */
    --now-line: rgba(0, 0, 0, 0.7);
    --broke-ink: #427660;                   /* 30日を突き破った後の数字の色 */

    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", Georgia, serif;
    --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  }
  /* 暗い壁紙の上で使うとき用(右クリック「文字色」でクリーム系に切り替え) */
  :root.cream-text {
    --ink: #f4ecd6;
    --ink-2: #e6dec6;
    --ink-3: #d9d0b6;
    --frame: #b9af94;
    --future-line: rgba(244, 236, 214, 0.20);
    --now-line: rgba(244, 236, 214, 0.85);
    --broke-ink: #c9e3a8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: transparent; }
  body {
    background: rgba(var(--bg-r), var(--bg-g), var(--bg-b), var(--bg-alpha));
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Ctrl+ホイールで全体を拡大縮小できるよう、全部を1つの入れ物に入れる */
  #zoomWrap {
    height: 100vh;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    transform-origin: top left;
  }

  header { flex: 0 0 auto; margin-bottom: 10px; }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-2);
    opacity: 0.8;
  }
  .ttl { margin: 0; opacity: 0.8; line-height: 0; }
  .ttl img { height: 13px; width: auto; display: block; }
  .range { margin-top: 5px; font-size: 8.5px; color: var(--ink-3); letter-spacing: 0.04em; opacity: 0.65; }

  .body { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; align-items: stretch; }

  /* 日ごとのブロック(下が1日目、上へ積み上がる) */
  .axis, .bar { display: flex; flex-direction: column-reverse; gap: 5px; }   /* ブロック同士の間隔(目盛りと同じ値にする) */
  .axis { width: 16px; font-family: var(--mono); font-size: 8px; color: var(--ink-3); opacity: 0.7; }
  .axis > div {
    flex: 1 1 0; min-height: 0;
    display: flex; align-items: center; justify-content: flex-end;
    line-height: 1; overflow: visible;
  }
  .axis > div.over { color: var(--ink-3); opacity: 0.8; }
  .barwrap { position: relative; width: 36px; flex: 0 0 auto; }
  .bar { height: 100%; width: 100%; }

  .blk {
    position: relative;
    flex: 1 1 0; min-height: 0;
    border-radius: 5px;   /* 角の丸み */
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--frame);
    background-color: rgba(var(--bg-r), var(--bg-g), var(--bg-b), var(--bg-alpha));
    background-image: repeating-linear-gradient(135deg, var(--future-line) 0 1.5px, transparent 1.5px 6px);
  }
  .blk > i {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0;
    background: var(--accent);
  }
  .blk.cur > i { box-shadow: inset 0 2px 0 var(--now-line); }

  /* 30日のタイマーを突き破った分: 枠も斜線もなく、色だけがブロックの形で上へ増えていく */
  .blk.over {
    box-shadow: none;
    background: none;
    overflow: visible;
  }
  .blk.over > i { border-radius: 5px; }

  .stats {
    display: flex; flex-direction: column; justify-content: center;
    gap: 7px; min-width: 0;
    color: var(--ink);
    white-space: nowrap;
  }
  .big { font-family: var(--serif); font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1; }
  .stats .lbl { font-size: 8.5px; letter-spacing: 0.08em; color: var(--ink-3); opacity: 0.75; }
  .stats .val { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 3px; }
  .stats.broke .big, .stats.broke .val { color: var(--broke-ink); }   /* 突き破った後は緑みの色に */
</style>

<script>
(function () {
  // WebView2 が最初のフォーカスをどこかに置かないように
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();

  // ===== タイマーの設定: 11月1日スタート、11月30日がラスト =====
  const START = new Date(2026, 10, 1);        // 2026-11-01 00:00
  const END_EXCL = new Date(2026, 11, 1);     // 11月30日の終わり(=12月1日 0:00)
  const MS_DAY = 86400000;
  const DAYS = Math.round((END_EXCL - START) / MS_DAY);   // 30
  // 「11/1 → 11/30」の表記(最終日は END_EXCL の前日)
  const lastDay = new Date(END_EXCL - MS_DAY);
  document.getElementById("range").textContent =
    (START.getMonth() + 1) + "/" + START.getDate() + " → " + (lastDay.getMonth() + 1) + "/" + lastDay.getDate();

  // ===== Ctrl+ホイールで拡大縮小 =====
  const zoomWrap = document.getElementById("zoomWrap");
  let zoomLevel = 1;
  try { zoomLevel = parseFloat(localStorage.getItem("g-zoom")) || 1; } catch (e) {}
  function applyZoom() {
    zoomWrap.style.transform = "scale(" + zoomLevel + ")";
    zoomWrap.style.width = (100 / zoomLevel) + "%";
    // 高さを固定してブロックの形をそろえる(画面が低い時だけ縮む)
    zoomWrap.style.height = "min(" + (100 / zoomLevel) + "vh, " + (670 / zoomLevel) + "px)";
  }
  window.addEventListener("wheel", function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    zoomLevel = Math.min(2, Math.max(0.4, zoomLevel + (e.deltaY < 0 ? 0.05 : -0.05)));
    try { localStorage.setItem("g-zoom", zoomLevel); } catch (e2) {}
    applyZoom();
  }, { passive: false });
  applyZoom();

  // ===== 背景の不透明度(右クリックメニューから。C# が setBgOpacity を呼ぶ) =====
  let bgOpacity = 100;
  try { const v = parseInt(localStorage.getItem("g-bg-opacity"), 10); if (Number.isFinite(v)) bgOpacity = v; } catch (e) {}
  function applyBgOpacity() { document.documentElement.style.setProperty("--bg-alpha", bgOpacity / 100); }
  window.setBgOpacity = function (n) {
    bgOpacity = Math.min(100, Math.max(0, Math.round(n)));
    try { localStorage.setItem("g-bg-opacity", bgOpacity); } catch (e) {}
    applyBgOpacity();
  };
  window.getBgOpacity = function () { return bgOpacity; };
  applyBgOpacity();

  // ===== ブロックの組み立て =====
  const axisEl = document.getElementById("axis");
  const barEl = document.getElementById("bar");
  let built = 0;           // 現在表示中のブロック数
  let blocks = [];

  function build(total) {
    axisEl.innerHTML = "";
    barEl.innerHTML = "";
    blocks = [];
    for (let i = 0; i < total; i++) {
      const n = i + 1;
      const a = document.createElement("div");
      const showLabel = n % 5 === 0;   // 日付の目盛りは5日ごと
      a.textContent = showLabel ? String(n) : "";
      if (i >= DAYS) a.className = "over";
      axisEl.appendChild(a);

      const b = document.createElement("div");
      b.className = "blk" + (i >= DAYS ? " over" : "");
      const f = document.createElement("i");
      b.appendChild(f);
      barEl.appendChild(b);
      blocks.push({ el: b, fill: f });
    }
    built = total;
  }

  function render() {
    // 動作確認用: ?now=2026-12-08T12:00 のように付けると、その時刻として表示する
    const nowParam = new URLSearchParams(location.search).get("now");
    const now = nowParam ? new Date(nowParam) : new Date();
    const elapsedDays = (now - START) / MS_DAY;          // 0 → 30 → さらに増える
    const dayIdx = Math.floor(elapsedDays);               // いま進行中の日(0始まり)
    const frac = Math.max(0, elapsedDays - dayIdx);
    // 30日の枠は常にあり、31日目以降は枠なしで上に増える
    const total = Math.max(DAYS, dayIdx + 1);
    if (total !== built) build(total);

    blocks.forEach((blk, i) => {
      let h = 0;
      if (elapsedDays >= 0) {
        if (i < dayIdx) h = 1;
        else if (i === dayIdx) h = frac;
      }
      blk.fill.style.height = (h * 100) + "%";
      blk.el.classList.toggle("cur", elapsedDays >= 0 && i === dayIdx);
    });

    const stats = document.getElementById("stats");
    const pct = Math.max(0, elapsedDays / DAYS * 100);
    document.getElementById("pct").textContent = pct.toFixed(1) + "%";
    if (now < END_EXCL) {
      stats.classList.remove("broke");
      document.getElementById("remLabel").textContent = "残り";
      const rem = Math.max(0, Math.round((END_EXCL - now) / MS_DAY));
      document.getElementById("remVal").textContent = rem + "日";
    } else {
      stats.classList.add("broke");
      document.getElementById("remLabel").textContent = "超過";
      const over = Math.floor((now - END_EXCL) / MS_DAY) + 1;
      document.getElementById("remVal").textContent = "+" + over + "日";
    }
  }
  render();
  setInterval(render, 1000);

  // ===== ウィンドウの移動・端でのサイズ変更(帯を隠しているときだけ。C#が __lcDragEnabled を設定) =====
  const RESIZE_MARGIN = 14;
  const RESIZE_CORNER = 26;
  const RESIZE_CURSORS = { 10: "ew-resize", 11: "ew-resize", 12: "ns-resize", 15: "ns-resize",
    13: "nwse-resize", 17: "nwse-resize", 14: "nesw-resize", 16: "nesw-resize" };
  function edgeHitTest(x, y) {
    const w = window.innerWidth, h = window.innerHeight;
    const left = x <= RESIZE_MARGIN, right = x >= w - RESIZE_MARGIN;
    const top = y <= RESIZE_MARGIN, bottom = y >= h - RESIZE_MARGIN;
    const cl = x <= RESIZE_CORNER, cr = x >= w - RESIZE_CORNER;
    const ct = y <= RESIZE_CORNER, cb = y >= h - RESIZE_CORNER;
    if (ct && cl) return 13;
    if (ct && cr) return 14;
    if (cb && cl) return 16;
    if (cb && cr) return 17;
    if (left) return 10;
    if (right) return 11;
    if (top) return 12;
    if (bottom) return 15;
    return 0;
  }
  document.addEventListener("mousemove", function (e) {
    if (!window.__lcDragEnabled) return;
    document.body.style.cursor = RESIZE_CURSORS[edgeHitTest(e.clientX, e.clientY)] || "";
  });
  document.addEventListener("mousedown", function (e) {
    if (!window.__lcDragEnabled) return;
    if (e.button !== 0) return;
    if (!(window.chrome && window.chrome.webview)) return;
    const dir = edgeHitTest(e.clientX, e.clientY);
    window.chrome.webview.postMessage(dir ? "start-resize:" + dir : "start-drag");
  });

  // F11 で「帯とツールバー」の表示/非表示
  document.addEventListener("keydown", function (e) {
    if (e.key !== "F11") return;
    e.preventDefault();
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("toggle-chrome");
  });
})();
</script>
